<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSpeak AI Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        p {
            color: #7f8c8d;
            text-align: center;
        }
        .input-group {
            margin-top: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            resize: none;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SafeSpeak AI Dashboard</h1>
        <p>Indic & Multilingual Cyberbullying & Toxic Content Filter</p>
        
        <div class="input-group">
            <textarea id="commentInput" placeholder="Yahan koi comment type karein (Jaise: 'you are stupid' ya 'good job')..."></textarea>
            <button onclick="analyzeComment()">Analyze Comment</button>
        </div>

        <div id="resultBox" class="result-box">
            <h3>Analysis Result:</h3>
            <p><strong>Category:</strong> <span id="resCategory"></span></p>
            <p><strong>Severity:</strong> <span id="resSeverity"></span></p>
            <p><strong>Explanation:</strong> <span id="resExplanation"></span></p>
            <p><strong>Suggested Rewrite:</strong> <span id="resRewrite" style="color: #27ae60;"></span></p>
        </div>
    </div>

    <script>
        async function analyzeComment() {
            let text = document.getElementById('commentInput').value;
            if(text.trim() === "") {
                alert("Pehle kuch type toh karo!");
                return;
            }

            let response = await fetch('/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: text })
            });

            let data = await response.json();

            document.getElementById('resCategory').innerText = data.category;
            document.getElementById('resSeverity').innerText = data.severity;
            document.getElementById('resExplanation').innerText = data.explanation;
            document.getElementById('resRewrite').innerText = data.rewrite;

            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
